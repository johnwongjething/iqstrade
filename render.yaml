services:
  - type: web
    name: iqstrade-unified
    env: python
    buildCommand: |
      # Install Python dependencies
      pip install -r backend/requirements.txt
      # Install Node.js dependencies and build frontend
      cd frontend && npm install && npm run build
      # Copy build to backend directory
      cp -r build/* ../backend/
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120 --max-requests 2000 --max-requests-jitter 200 --preload --worker-class gthread --worker-connections 1000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 18.0.0 